[project]
name = "notizer-core"
version = "0.1.0"
description = "Notizer Core – lokaler Hintergrunddienst der Notizer Desktop-App"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    "platformdirs>=4.2",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.6"]

[project.scripts]
notizer-core = "notizer_core.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["notizer_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
