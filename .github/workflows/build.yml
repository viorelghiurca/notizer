# Baut die Installer für Windows (.exe, .msi) und Linux (.deb, .AppImage).
# Start: manuell unter "Actions → Build → Run workflow" oder durch ein Tag wie v0.1.0.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Linux-Bibliotheken für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Core-Tests
        run: |
          python -m pip install --upgrade pip
          pip install -e "./core[dev]"
          python -m pytest core -q

      - name: Core als Einzeldatei bauen
        run: python scripts/build_core.py

      - name: App bauen
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: notizer-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
